name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            g++ \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub2-common \
            libgmock-dev \
            libgtest-dev \
            make \
            mtools \
            ovmf \
            python3 \
            qemu-system-x86 \
            xorriso

      - name: Configure ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run all tests
        run: make test USE_DOCKER=0 WERROR=1 REQUIRE_UEFI=1

  docker:
    name: Docker Build and Boot Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the kernel in the Docker image
        run: make all USE_DOCKER=1 WERROR=1

      - name: Boot test in the Docker image
        run: make run-boot-test USE_DOCKER=1 REQUIRE_UEFI=1
