name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            g++ \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub2-common \
            libgmock-dev \
            libgtest-dev \
            make \
            mtools \
            ovmf \
            pipx \
            python3 \
            qemu-system-x86 \
            xorriso

      # clang-format versions format some code differently, so the check pins
      # the one that README.md names instead of the distribution's.
      - name: Check C++ formatting
        run: |
          pipx run --spec clang-format==21.1.8 clang-format --dry-run --Werror \
            *.cpp *.h selftest/*.cpp selftest/*.h \
            user/*.cpp user/*.h user/*/*.cpp user/*/*.h

      - name: Configure ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run all tests
        run: make test USE_DOCKER=0 WERROR=1 REQUIRE_UEFI=1

  docker:
    name: Docker Build, Unit, and Boot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and run unit and boot tests in the Docker image
        run: make docker-test WERROR=1 REQUIRE_UEFI=1
